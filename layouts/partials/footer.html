<script>
    (() => {
        const rails = document.querySelectorAll("body > .site-rail, body > .reference-index");
        if (!rails.length || !("showPopover" in HTMLElement.prototype)) return;
        const mobile = window.matchMedia("(max-width: 760px)");
        function closeDrawers() {
            for (const rail of rails) {
                if (rail.matches(":popover-open")) rail.hidePopover();
            }
        }
        function updateDrawers() {
            closeDrawers();
            for (const rail of rails) rail.toggleAttribute("popover", mobile.matches);
            document.documentElement.classList.toggle("has-drawers", mobile.matches);
        }
        const masthead = document.querySelector(".site-masthead");
        const updateMastheadSize = () => {
            document.documentElement.style.setProperty("--masthead-height", masthead.offsetHeight + "px");
        };
        new ResizeObserver(updateMastheadSize).observe(masthead);
        updateMastheadSize();
        updateDrawers();
        mobile.addEventListener("change", updateDrawers);
        for (const rail of rails) {
            rail.addEventListener("click", event => {
                if (mobile.matches && event.target.closest("a[href]")) closeDrawers();
            });
        }
        window.addEventListener("reader:navigate", closeDrawers);
    })();
</script>
