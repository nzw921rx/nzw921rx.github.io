<script type="module">
    for (const code of document.querySelectorAll("pre > code.language-mermaid, pre > code[data-lang='mermaid']")) {
        const block = document.createElement("div");
        block.className = "mermaid";
        block.textContent = code.textContent;
        code.parentElement.replaceWith(block);
    }

    const blocks = Array.from(document.querySelectorAll(".mermaid"));
    if (blocks.length) {
        const sources = blocks.map(block => block.textContent);
        const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs");
        const root = document.documentElement;
        const theme = () => root.dataset.theme === "dark" ? "dark" : "default";
        let renderedTheme;
        let rendering = false;

        async function render() {
            if (rendering) return;
            rendering = true;
            try {
                // A toggle during Mermaid's asynchronous layout is picked up on the next pass.
                while (renderedTheme !== theme()) {
                    const nextTheme = theme();
                    mermaid.initialize({ startOnLoad: false, theme: nextTheme });
                    blocks.forEach((block, index) => {
                        block.removeAttribute("data-processed");
                        block.textContent = sources[index];
                    });
                    await mermaid.run({ nodes: blocks });
                    renderedTheme = nextTheme;
                }
            } finally {
                rendering = false;
            }
        }

        new MutationObserver(render).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
        await render();
    }
</script>
